# Dependency updates. Every PR goes through the protected master: CI (Frontend + Backend,
# with npm audit / pip-audit) must be green before it can merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for all minor/patch bumps; majors arrive one by one to review their changelog.
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Django 5.2 es LTS (soporte hasta 2028-04); DRF, allauth y otras aún no soportan 6.x.
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
      # pandas 3 exige numpy 2 (y pandas 2 exige numpy < 2): por separado nunca instalan.
      # Se suben juntos a mano, probados contra los parsers bancarios de tesorería.
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
