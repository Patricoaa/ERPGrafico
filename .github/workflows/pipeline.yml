name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  frontend:
    name: Frontend
    # Pinned: Playwright has no Chromium build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      
      - name: Install dependencies
        # Same flag as frontend/Dockerfile: @sentry/nextjs 8 does not declare Next 16 as a peer.
        run: npm ci --legacy-peer-deps
      
      - name: Lint
        # Errors block. Warnings are tracked by ratchets (no-unsafe.contract.test.ts) and GitHub would
        # only show the first 10 of ~600 as annotations.
        run: npm run lint -- --quiet

      - name: Type Check
        run: npm run type-check

      - name: Install Chromium for Storybook tests
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm run test -- --run --coverage
      
      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: erpgrafico_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/erpgrafico_test
      SECRET_KEY: ci-secret-key-placeholder-for-tests
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      REDIS_URL: "redis://localhost:6379"
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: './backend/requirements.txt'
      
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Build Rust extension (PyO3)
        run: |
          pip install maturin
          cd rust_ext && maturin build --release --out /tmp/wheels

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-django pytest-cov factory-boy
          pip install /tmp/wheels/*.whl

      - name: Rust unit tests
        run: cd rust_ext && cargo test

      - name: Ruff undefined names (blocking)
        run: ruff check . --select F821

      - name: Ruff Check (ratchet)
        run: |
          out=$(ruff check . 2>&1 || true)
          count=$(echo "$out" | grep -oE 'Found [0-9]+ error' | grep -oE '[0-9]+' || echo 0)
          echo "Ruff findings: ${count} (baseline 342)"
          echo "$out" | grep -vE 'Found [0-9]+ error' | tail -40 || true
          if [ "${count:-0}" -gt 342 ]; then
            echo "::error::New Ruff findings introduced. Run 'cd backend && ruff check . --fix' locally."
            exit 1
          fi
      
      - name: Django Check
        run: python manage.py check
      
      - name: Check Migrations
        run: python manage.py makemigrations --check --dry-run
      
      - name: Invariants and query-count gate (blocking, ADR-0118)
        run: pytest -m ci_gate -q

      - name: Full test suite (non-blocking)
        run: |
          # Known failures are listed in docs/40-quality/testing.md. Non-blocking until
          # they are resolved; do not add new failures.
          pytest --cov=. --cov-report=xml || echo "Backend tests failing (non-blocking — tracked debt)"

  security:
    name: Security Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      
      - name: Install Security Tools
        run: pip install bandit safety
      
      - name: Bandit Scan
        run: bandit -r ./backend -ll || echo "Bandit found potential security issues"
      
      - name: Safety Check
        run: safety check || echo "Safety found vulnerable dependencies"
